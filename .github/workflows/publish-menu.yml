name: Publish Menu from Email

on:
  schedule:
    # Last 6 days of month (25-31) + first 5 days (1-5)
    - cron: '0 8 25-31 * *'
    - cron: '0 8 1-5 * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MENU_PUBLISH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install -r upload-mail-menu/requirements.txt

      - name: Fetch menu PDF from email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALLOWED_SENDER: ${{ secrets.ALLOWED_SENDER }}
        run: python upload-mail-menu/publish_menu.py

      - name: Commit and push if the menu changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/uploads/menjador.pdf public/uploads/menjador.jpg; then
            echo "No hi ha cap menú nou. Res a publicar."
            exit 0
          fi

          git config user.name "afa-itaca-bot"
          git config user.email "actions@github.com"
          git add public/uploads/menjador.pdf public/uploads/menjador.jpg
          git commit -m "Actualitza el menú del menjador"
          git push
